name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend (lint + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Lint (ruff, critical rules)
        run: ruff check app --select E9,F63,F7,F82,F401
      - name: Test (pytest)
        # スケジューラ/外部XMLはテストで無効（conftest）。ネット非依存。
        run: python -m pytest -q

  security:
    name: security (dependency scan)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit backend dependencies (requirements.txt)
        run: python -m pip_audit -r requirements.txt

  frontend:
    name: frontend (logic + adapter tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Logic smoke test
        run: node frontend/test/logic-smoke.mjs
      - name: Adapter contract test
        run: node frontend/test/adapter-contract.cjs
      - name: API config policy test
        run: node frontend/test/api-config-policy.cjs
      - name: Serve proxy policy test
        run: python3 frontend/test/serve-proxy-policy.py
      - name: CDN policy test
        run: node frontend/test/cdn-policy.cjs
      - name: Vendor asset policy test
        run: node frontend/test/vendor-assets-policy.cjs

  e2e-smoke:
    name: e2e smoke (browser login)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend/test deps
        run: pip install -r backend/requirements.txt playwright
      - name: Install Playwright browser
        run: python -m playwright install --with-deps firefox
      - name: Browser E2E smoke
        run: python frontend/test/e2e_smoke.py

  docker-build:
    name: docker compose + build (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose config
        run: POSTGRES_PASSWORD=ci-local-only docker compose config --quiet
      - name: Build backend image
        run: docker build -t cwwd-backend ./backend
      - name: Build frontend image
        run: docker build -t cwwd-frontend ./frontend
