name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Lint (ruff, critical rules)
        run: ruff check app --select E9,F63,F7,F82,F401
      - name: Test (pytest)
        # スケジューラ/外部XMLはテストで無効（conftest）。ネット非依存。
        run: python -m pytest -q

  security:
    name: security (dependency scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit backend dependencies (requirements.txt)
        run: python -m pip_audit -r requirements.txt

  frontend:
    name: frontend (logic + adapter tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Logic smoke test
        run: node frontend/test/logic-smoke.mjs
      - name: Adapter contract test
        run: node frontend/test/adapter-contract.cjs

  docker-build:
    name: docker build (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t cwwd-backend ./backend
      - name: Build frontend image
        run: docker build -t cwwd-frontend ./frontend
